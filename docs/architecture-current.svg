<svg viewBox="0 0 1300 900" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f97316"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a855f7"/></marker>
  </defs>

  <rect width="1300" height="900" fill="#0d1117"/>

  <text x="650" y="35" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold" letter-spacing="2">THE SOVEREIGN SENTINEL — CURRENT ARCHITECTURE</text>
  <text x="650" y="56" text-anchor="middle" fill="#8b949e" font-size="12">Real-Time Forex Data Pipeline · Local PoC Deployment</text>

  <!-- legend -->
  <rect x="30" y="78" width="14" height="14" fill="#3b82f6"/>
  <text x="50" y="90" fill="#8b949e" font-size="12">Ingestion</text>
  <rect x="140" y="78" width="14" height="14" fill="#f97316"/>
  <text x="160" y="90" fill="#8b949e" font-size="12">Kafka</text>
  <rect x="235" y="78" width="14" height="14" fill="#10b981"/>
  <text x="255" y="90" fill="#8b949e" font-size="12">Storage</text>
  <rect x="345" y="78" width="14" height="14" fill="#a855f7"/>
  <text x="365" y="90" fill="#8b949e" font-size="12">Observability</text>

  <!-- Binance WebSocket -->
  <rect x="30" y="115" width="180" height="70" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="120" y="138" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">Binance</text>
  <text x="120" y="153" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">WebSocket</text>
  <text x="120" y="171" text-anchor="middle" fill="#6b7280" font-size="10">wss://stream.binance.com</text>

  <!-- Scala LocalRunner -->
  <rect x="270" y="105" width="200" height="90" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="370" y="128" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">Scala LocalRunner</text>
  <text x="370" y="146" text-anchor="middle" fill="#6b7280" font-size="9">FxTickSourceTask</text>
  <text x="370" y="159" text-anchor="middle" fill="#6b7280" font-size="9">LiveWebSocketClient</text>
  <text x="370" y="172" text-anchor="middle" fill="#6b7280" font-size="9">SENTINEL_MODE=kafka</text>

  <!-- KafkaProducer -->
  <rect x="520" y="105" width="190" height="90" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="615" y="128" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold">KafkaProducer</text>
  <text x="615" y="150" text-anchor="middle" fill="#6b7280" font-size="9">enable.idempotence=true</text>
  <text x="615" y="163" text-anchor="middle" fill="#6b7280" font-size="9">compression=none</text>

  <!-- Schema Registry (new) -->
  <rect x="520" y="215" width="190" height="80" rx="4" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="615" y="238" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">Schema Registry</text>
  <text x="615" y="257" text-anchor="middle" fill="#6b7280" font-size="9">BACKWARD_TRANSITIVE</text>
  <text x="615" y="270" text-anchor="middle" fill="#6b7280" font-size="9">forex.ticks.raw (FxTick.avsc)</text>
  <text x="615" y="283" text-anchor="middle" fill="#6b7280" font-size="9">localhost:8081</text>

  <!-- Kafka Cluster -->
  <rect x="770" y="90" width="230" height="185" rx="4" fill="none" stroke="#f97316" stroke-width="1.5"/>
  <text x="885" y="112" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">Kafka Cluster</text>

  <rect x="790" y="122" width="60" height="24" rx="3" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="820" y="138" text-anchor="middle" fill="#f97316" font-size="9">broker-1</text>
  <rect x="856" y="122" width="60" height="24" rx="3" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="886" y="138" text-anchor="middle" fill="#f97316" font-size="9">broker-2</text>
  <rect x="922" y="122" width="60" height="24" rx="3" fill="none" stroke="#f97316" stroke-width="1"/>
  <text x="952" y="138" text-anchor="middle" fill="#f97316" font-size="9">broker-3</text>

  <text x="885" y="163" text-anchor="middle" fill="#eab308" font-size="10" font-weight="bold">forex.ticks.raw</text>
  <text x="885" y="177" text-anchor="middle" fill="#6b7280" font-size="9">RF=3 · 6 partitions</text>
  <text x="885" y="189" text-anchor="middle" fill="#6b7280" font-size="9">min.insync.replicas=2</text>
  <text x="885" y="201" text-anchor="middle" fill="#6b7280" font-size="9">retention=7d</text>
  <text x="885" y="216" text-anchor="middle" fill="#6b7280" font-size="9">key: {pair}:{ts_micros}</text>
  <text x="885" y="234" text-anchor="middle" fill="#6b7280" font-size="9">producer: acks=all</text>
  <text x="885" y="247" text-anchor="middle" fill="#6b7280" font-size="9">retries=MAX · plaintext:9092</text>

  <!-- ZooKeeper -->
  <rect x="1050" y="115" width="200" height="70" rx="4" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="1150" y="138" text-anchor="middle" fill="#f97316" font-size="13" font-weight="bold">ZooKeeper</text>
  <text x="1150" y="156" text-anchor="middle" fill="#6b7280" font-size="9">port 2181</text>
  <text x="1150" y="169" text-anchor="middle" fill="#6b7280" font-size="9">healthcheck: srvr</text>

  <!-- Kafka UI (new) -->
  <rect x="1050" y="215" width="200" height="80" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1150" y="238" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">Kafka UI</text>
  <text x="1150" y="257" text-anchor="middle" fill="#6b7280" font-size="9">topic and consumer-lag browser</text>
  <text x="1150" y="270" text-anchor="middle" fill="#6b7280" font-size="9">127.0.0.1:8080</text>
  <text x="1150" y="283" text-anchor="middle" fill="#6b7280" font-size="9">loopback-only</text>

  <!-- Prometheus -->
  <rect x="270" y="330" width="200" height="90" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="370" y="353" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">Prometheus</text>
  <text x="370" y="375" text-anchor="middle" fill="#6b7280" font-size="9">scrape_interval: 5s</text>
  <text x="370" y="388" text-anchor="middle" fill="#6b7280" font-size="9">127.0.0.1:9090</text>
  <text x="370" y="401" text-anchor="middle" fill="#6b7280" font-size="9">target: LocalRunner :9091</text>

  <!-- Python Persistence Consumer -->
  <rect x="770" y="330" width="230" height="90" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="885" y="353" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">Python Persistence</text>
  <text x="885" y="368" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">Consumer</text>
  <text x="885" y="388" text-anchor="middle" fill="#6b7280" font-size="9">batch_size=500 · flush=2s</text>
  <text x="885" y="401" text-anchor="middle" fill="#6b7280" font-size="9">auto.commit=false · group=sentinel</text>

  <!-- Grafana -->
  <rect x="180" y="450" width="400" height="145" rx="4" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <text x="380" y="474" text-anchor="middle" fill="#a855f7" font-size="13" font-weight="bold">Grafana</text>

  <rect x="200" y="484" width="150" height="24" rx="3" fill="none" stroke="#a855f7" stroke-width="1"/>
  <text x="275" y="500" text-anchor="middle" fill="#a855f7" font-size="9">DS: Prometheus</text>
  <rect x="410" y="484" width="150" height="24" rx="3" fill="none" stroke="#10b981" stroke-width="1"/>
  <text x="485" y="500" text-anchor="middle" fill="#10b981" font-size="9">DS: ClickHouse (plugin)</text>

  <text x="380" y="527" text-anchor="middle" fill="#6b7280" font-size="9">FX Live Dashboard · 127.0.0.1:3000</text>
  <text x="380" y="540" text-anchor="middle" fill="#6b7280" font-size="9">Panels: Tick Rate · Bid/Ask · Spread · Consumer Lag</text>
  <text x="380" y="558" text-anchor="middle" fill="#6b7280" font-size="9" font-style="italic">admin credentials: env-configured, not hardcoded</text>
  <text x="380" y="571" text-anchor="middle" fill="#6b7280" font-size="9">auto-refresh: 5s</text>

  <!-- ClickHouse -->
  <rect x="770" y="450" width="260" height="145" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="900" y="474" text-anchor="middle" fill="#10b981" font-size="13" font-weight="bold">ClickHouse</text>
  <text x="900" y="495" text-anchor="middle" fill="#6b7280" font-size="9">sentinel.forex_ticks · MergeTree engine</text>
  <text x="900" y="508" text-anchor="middle" fill="#6b7280" font-size="9">ORDER BY (currency_pair, source_timestamp_micros)</text>
  <text x="900" y="521" text-anchor="middle" fill="#6b7280" font-size="9">TTL source_timestamp_micros + INTERVAL 30 DAY</text>
  <text x="900" y="534" text-anchor="middle" fill="#6b7280" font-size="9">Decimal(18,8) precision · dedup window=100</text>
  <text x="900" y="553" text-anchor="middle" fill="#10b981" font-size="9">127.0.0.1:8123 (HTTP) · 127.0.0.1:9000 (native)</text>
  <text x="900" y="566" text-anchor="middle" fill="#6b7280" font-size="9">loopback-only, verified externally unreachable</text>

  <!-- arrows -->
  <line x1="210" y1="150" x2="266" y2="150" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="238" y="143" text-anchor="middle" fill="#3b82f6" font-size="8">bookTicker · 3 pairs</text>

  <line x1="470" y1="150" x2="516" y2="150" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="493" y="143" text-anchor="middle" fill="#3b82f6" font-size="8">produce</text>

  <line x1="615" y1="195" x2="615" y2="211" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="660" y="207" text-anchor="middle" fill="#f97316" font-size="8">validate schema</text>

  <line x1="710" y1="255" x2="766" y2="200" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <line x1="710" y1="150" x2="766" y2="150" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="738" y="143" text-anchor="middle" fill="#3b82f6" font-size="8">acks=all</text>

  <line x1="1000" y1="145" x2="1046" y2="145" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1023" y="138" text-anchor="middle" fill="#f97316" font-size="8">retries=MAX</text>

  <line x1="1000" y1="255" x2="1046" y2="255" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="1023" y="248" text-anchor="middle" fill="#a855f7" font-size="8">admin</text>

  <line x1="370" y1="195" x2="370" y2="326" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="410" y="265" text-anchor="middle" fill="#a855f7" font-size="8">:9091/metrics</text>

  <line x1="885" y1="275" x2="885" y2="326" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="940" y="305" text-anchor="middle" fill="#f97316" font-size="8">poll() isolation=read_committed</text>

  <line x1="370" y1="420" x2="370" y2="446" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="405" y="437" text-anchor="middle" fill="#a855f7" font-size="8">PromQL</text>

  <line x1="885" y1="420" x2="885" y2="446" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="945" y="437" text-anchor="middle" fill="#10b981" font-size="8">INSERT batch, native:9000</text>

  <line x1="580" y1="530" x2="766" y2="500" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <text x="650" y="497" text-anchor="middle" fill="#10b981" font-size="8">SQL · HTTP:8123</text>

  <!-- footer bars -->
  <rect x="30" y="720" width="1240" height="70" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="742" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">DOCKER COMPOSE STACK · monitoring/docker-compose.yml</text>
  <text x="650" y="763" text-anchor="middle" fill="#6b7280" font-size="9">sentinel-zookeeper · sentinel-broker-{1,2,3} · sentinel-schema-registry · sentinel-clickhouse · sentinel-prometheus · sentinel-grafana</text>
  <text x="650" y="778" text-anchor="middle" fill="#6b7280" font-size="9">sentinel-persistence-consumer · sentinel-kafka-ui · sentinel-kafka-topic-init</text>

  <rect x="30" y="805" width="1240" height="55" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="827" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="bold" letter-spacing="1">DATA FLOW</text>
  <text x="650" y="847" text-anchor="middle" fill="#6b7280" font-size="9">Binance WS → LocalRunner → KafkaProducer → Kafka Cluster (Schema Registry validated) → Persistence Consumer → ClickHouse → Grafana</text>

  <text x="650" y="885" text-anchor="middle" fill="#484f58" font-size="9">All service ports bound to 127.0.0.1 (loopback only) · verified externally unreachable · no credentials embedded in this diagram</text>
</svg>
